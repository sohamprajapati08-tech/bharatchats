services:
  # Backend API & WebSocket Service
  - type: web
    name: bharat-chat-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix server && npm run build --prefix server
    startCommand: npm run start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: bharat-chat-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: STUN_SERVERS
        value: "stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302"

databases:
  # Managed PostgreSQL Free Tier Database
  - name: bharat-chat-db
    plan: free
    region: oregon
    databaseName: bharatchat
    user: bharat_admin
