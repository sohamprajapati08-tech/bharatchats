<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b141a" />
      <stop offset="100%" stop-color="#111b21" />
    </linearGradient>
    <linearGradient id="indiaSaffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF671F" />
    </linearGradient>
    <linearGradient id="indiaGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#00A86B" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a884" />
      <stop offset="100%" stop-color="#008069" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#222e35" stroke-width="8"/>

  <!-- Subtle Indian Tricolor Glow Rings -->
  <path d="M 66 256 A 190 190 0 0 1 446 256" fill="none" stroke="url(#indiaSaffron)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M 66 256 A 190 190 0 0 0 446 256" fill="none" stroke="url(#indiaGreen)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- Main Chat Bubble Body -->
  <path d="M 256 120 C 167.63 120 96 186.26 96 268 C 96 298.8 107.03 327.34 126.12 350.56 L 108 408 L 171.74 391.26 C 196.44 406.84 225.26 416 256 416 C 344.37 416 416 349.74 416 268 C 416 186.26 344.37 120 256 120 Z" fill="url(#bubbleGrad)" filter="url(#glow)"/>

  <!-- Center Chakra & Shield Emblem (Digital Sovereignty) -->
  <circle cx="256" cy="268" r="56" fill="#ffffff" opacity="0.95"/>
  <circle cx="256" cy="268" r="46" fill="none" stroke="#003366" stroke-width="4"/>
  <circle cx="256" cy="268" r="10" fill="#003366"/>

  <!-- Chakra Spokes -->
  <g stroke="#003366" stroke-width="2.5" stroke-linecap="round">
    <line x1="256" y1="224" x2="256" y2="312" />
    <line x1="212" y1="268" x2="300" y2="268" />
    <line x1="225" y1="237" x2="287" y2="299" />
    <line x1="225" y1="299" x2="287" y2="237" />
    <line x1="240" y1="226" x2="272" y2="310" />
    <line x1="272" y1="226" x2="240" y2="310" />
    <line x1="214" y1="252" x2="298" y2="284" />
    <line x1="214" y1="284" x2="298" y2="252" />
  </g>
</svg>
